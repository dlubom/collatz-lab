[package]
name = "collatz-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rug = { version = "=1.30.0", default-features = false, features = ["integer"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.7.0"

[[bench]]
name = "engines"
harness = false
