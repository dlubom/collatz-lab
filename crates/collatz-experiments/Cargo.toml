[package]
name = "collatz-experiments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
collatz-engine = { path = "../collatz-engine" }
rand_chacha = "=0.10.0"
rug = { version = "=1.30.0", default-features = false, features = ["integer"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
jsonschema = { version = "=0.49.7", default-features = false }
proptest = "1.7.0"

[build-dependencies]
sha2 = "=0.11.0"
